# Komodo Core: gerencia os stacks de todos os LXCs a partir deste repositório.
# Os LXCs rodam o agente Periphery via systemd (/etc/komodo/periphery.config.toml),
# conectando de saída em ws://192.168.10.50:9120.
# Segredos das stacks ficam em ${CONFIG_PATH}/komodo/core.config.toml ([secrets]), fora do git.
# Dados em bind mount (e não volume) para entrarem no backup do Proxmox.

networks:
  monitor_net:
    external: true

services:
  # MongoDB não roda em kernel >= 6.19 (pve2/pve3 estão no 7.0) — FerretDB sobre Postgres no lugar.
  # Versões fixadas e casadas: atualizar as duas juntas, conforme o release do FerretDB.
  komodo-postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    container_name: komodo-postgres
    restart: unless-stopped
    labels:
      komodo.skip: # não parar com StopAllContainers
    environment:
      - POSTGRES_USER=komodo
      - POSTGRES_PASSWORD=${KOMODO_DB_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - ${CONFIG_PATH}/komodo/postgres:/var/lib/postgresql/data
    networks:
      - monitor_net

  komodo-ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    container_name: komodo-ferretdb
    restart: unless-stopped
    labels:
      komodo.skip:
    depends_on:
      - komodo-postgres
    environment:
      - FERRETDB_POSTGRESQL_URL=postgres://komodo:${KOMODO_DB_PASSWORD}@komodo-postgres:5432/postgres
    volumes:
      - ${CONFIG_PATH}/komodo/ferretdb:/state
    networks:
      - monitor_net

  komodo-core:
    image: ghcr.io/moghtech/komodo-core:2
    container_name: komodo-core
    init: true
    restart: unless-stopped
    labels:
      komodo.skip:
    depends_on:
      - komodo-ferretdb
    ports:
      - "9120:9120"
    environment:
      - TZ=${TZ}
      - KOMODO_HOST=https://komodo.ihome.dev.br
      - KOMODO_TITLE=iHome
      - KOMODO_DATABASE_ADDRESS=komodo-ferretdb:27017
      - KOMODO_DATABASE_USERNAME=komodo
      - KOMODO_DATABASE_PASSWORD=${KOMODO_DB_PASSWORD}
      - KOMODO_LOCAL_AUTH=true
      - KOMODO_INIT_ADMIN_USERNAME=admin
      - KOMODO_INIT_ADMIN_PASSWORD=${KOMODO_ADMIN_PASSWORD}
      # Registro só via OIDC (Authentik, grupo Homelab); conta nova nasce desativada até um admin liberar
      - KOMODO_DISABLE_USER_REGISTRATION=false
      - KOMODO_ENABLE_NEW_USERS=false
      - KOMODO_OIDC_ENABLED=true
      - KOMODO_OIDC_PROVIDER=https://auth.ihome.dev.br/application/o/komodo/
      - KOMODO_OIDC_USE_FULL_EMAIL=true
      - KOMODO_FIRST_SERVER_NAME=
      - KOMODO_JWT_SECRET=${KOMODO_JWT_SECRET}
      - KOMODO_WEBHOOK_SECRET=${KOMODO_WEBHOOK_SECRET}
      - KOMODO_RESOURCE_POLL_INTERVAL=5-min
    volumes:
      - ${CONFIG_PATH}/komodo/keys:/config/keys
      - ${CONFIG_PATH}/komodo/backups:/backups
      - ${CONFIG_PATH}/komodo/core.config.toml:/config/config.toml:ro
    # KOMODO_OIDC_CLIENT_ID / KOMODO_OIDC_CLIENT_SECRET
    env_file:
      - ${CONFIG_PATH}/komodo/oidc.env
    extra_hosts:
      - auth.ihome.dev.br:192.168.10.10
    networks:
      - monitor_net
