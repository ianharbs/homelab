# Notificações do homelab → tópico "Homelab" do grupo iHome no Telegram (bot @iHomeSCbot).
# O ntfy foi removido em 16/11/2026 (não estava sendo usado na prática).
#
# stack-watch: recebe os alertas do Komodo (alerter "telegram", endpoint Custom
# http://stack-watch:8096/komodo, pela monitor_net) e do Proxmox (webhook "telegram", só
# warning/erro, http://192.168.10.50:8096/pve?token=…) e manda só falhas (as do Komodo repetem a
# cada 6 h até resolver) e atualizações que pedem ação manual.
# Código em stack-watch/watch.py; segredos em ${CONFIG_PATH}/stack-watch/secrets.env (lido pelo
# script). Mudou só o .py? `docker restart stack-watch` (o Komodo não redeploya sem mudar o compose).
# Estado atual: curl http://stack-watch:8096/ de dentro da monitor_net.
networks:
  monitor_net:
    external: true

services:
  stack-watch:
    image: python:3.12-alpine
    container_name: stack-watch
    restart: unless-stopped
    user: ${PUID}:${PGID}
    command: ["python", "-u", "/app/watch.py"]
    environment:
      - TZ=${TZ}
      - IGNORE=apps-tasks
    ports:
      - 192.168.10.50:8096:8096   # só p/ o webhook do Proxmox (/pve exige token); /komodo recusa quem vem de fora
    volumes:
      - ./stack-watch:/app:ro
      - ${CONFIG_PATH}/stack-watch:/state
    networks:
      - monitor_net
