global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'lxc100 (srv-omada)'
    static_configs:
      - targets: ['192.168.10.5:9100']
        labels:
          instance: 'srv-omada'

  - job_name: 'lxc101 (srv-gateway)'
    static_configs:
      - targets: ['192.168.10.10:9100']
        labels:
          instance: 'srv-gateway'

  - job_name: 'lxc102 (srv-media)'
    static_configs:
      - targets: ['192.168.10.20:9100']
        labels:
          instance: 'srv-media'

  - job_name: 'lxc103 (srv-apps)'
    static_configs:
      - targets: ['192.168.10.30:9100']
        labels:
          instance: 'srv-apps'

  - job_name: 'lxc104 (srv-security)'
    static_configs:
      - targets: ['192.168.10.40:9100']
        labels:
          instance: 'srv-security'

  - job_name: 'lxc105 (srv-monitor)'
    static_configs:
      - targets: ['192.168.10.50:9100']
        labels:
          instance: 'srv-monitor'

  - job_name: 'lxc107 (srv-games)'
    static_configs:
      - targets: ['192.168.10.70:9100']
        labels:
          instance: 'srv-games'

  - job_name: 'lxc108 (srv-ai)'
    static_configs:
      - targets: ['192.168.10.80:9100']
        labels:
          instance: 'srv-ai'

  # Nós do cluster iHomeCluster (node_exporter no host Proxmox)
  - job_name: 'servidor (pve-nodes)'
    static_configs:
      - targets: ['192.168.10.2:9100']
        labels:
          instance: 'pve'
      - targets: ['192.168.10.3:9100']
        labels:
          instance: 'pve2'
      - targets: ['192.168.10.4:9100']
        labels:
          instance: 'pve3'

  # pve-exporter: métricas do cluster (guests, storage, status) — coletadas uma vez só
  - job_name: 'pve'
    metrics_path: /pve
    params:
      module: [default]
      cluster: ['1']
      node: ['0']
    static_configs:
      - targets: ['192.168.10.2']
    relabel_configs: &pve_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 192.168.10.50:9221
    metric_relabel_configs: &pve_metric_relabel
      - source_labels: [id]
        regex: 'lxc/100'
        target_label: nodename
        replacement: 'srv-omada'
      - source_labels: [id]
        regex: 'lxc/101'
        target_label: nodename
        replacement: 'srv-gateway'
      - source_labels: [id]
        regex: 'lxc/102'
        target_label: nodename
        replacement: 'srv-media'
      - source_labels: [id]
        regex: 'lxc/103'
        target_label: nodename
        replacement: 'srv-apps'
      - source_labels: [id]
        regex: 'lxc/104'
        target_label: nodename
        replacement: 'srv-security'
      - source_labels: [id]
        regex: 'lxc/105'
        target_label: nodename
        replacement: 'srv-monitor'
      - source_labels: [id]
        regex: 'qemu/106'
        target_label: nodename
        replacement: 'vm-haos'
      - source_labels: [id]
        regex: 'lxc/107'
        target_label: nodename
        replacement: 'srv-games'
      - source_labels: [id]
        regex: 'lxc/108'
        target_label: nodename
        replacement: 'srv-ai'
      - source_labels: [id]
        regex: 'node/(.+)'
        target_label: nodename
        replacement: '$1'

  # pve-exporter: métricas específicas de cada nó (versão, replicação, subscription, config)
  - job_name: 'pve-nodes'
    metrics_path: /pve
    params:
      module: [default]
      cluster: ['0']
      node: ['1']
    static_configs:
      - targets: ['192.168.10.2', '192.168.10.3', '192.168.10.4']
    relabel_configs: *pve_relabel
    metric_relabel_configs: *pve_metric_relabel

  - job_name: 'cadvisor-srv-omada'
    static_configs:
      - targets: ['192.168.10.5:8082']
        labels:
          instance: 'srv-omada'

  - job_name: 'cadvisor-srv-gateway'
    static_configs:
      - targets: ['192.168.10.10:8082']
        labels:
          instance: 'srv-gateway'

  - job_name: 'cadvisor-srv-media'
