modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []  # aceita qualquer 2xx
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"

  # Igual ao http_2xx, sem validar certificado (serviços com TLS autoassinado, ex.: Frigate)
  http_2xx_insecure:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"
      tls_config:
        insecure_skip_verify: true

  http_post_2xx:
    prober: http
    timeout: 5s
    http:
      method: POST
      valid_status_codes: [200, 201]

  tcp_connect:
    prober: tcp
    timeout: 5s

  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: "ip4"

  # Resolve ihome.dev.br via UDP; falha se o AdGuard não responder com registro
  dns_udp:
    prober: dns
    timeout: 5s
    dns:
      query_name: "ihome.dev.br"
      query_type: "A"
      transport_protocol: "udp"
      preferred_ip_protocol: "ip4"
      valid_rcodes: ["NOERROR"]
