---
# ============================================================
# Homepage — iHomeCluster (pve .2 · pve2 .3 · pve3 .4)
# Links (href) = endereço externo *.ihome.dev.br (NPM + Cloudflare)
# Widgets (url) = IP interno, que é como o container do Homepage alcança os serviços
# Segredos: {{HOMEPAGE_VAR_*}} vêm de /opt/docker/homepage/secrets.env (env_file do compose)
# ============================================================

# ============================================================
# INFRAESTRUTURA
# ============================================================
- Infraestrutura:

    - pve:
        icon: sh-proxmox
        href: https://pve.ihome.dev.br
        description: Nó 1 · i5-14600K · 192.168.10.2
        widget:
          type: proxmox
          url: https://192.168.10.2:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_API_USERNAME}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_API_PASSWORD}}"
          node: pve

    - pve2:
        icon: sh-proxmox
        href: https://pve2.ihome.dev.br
        description: Nó 2 · 192.168.10.3
        widget:
          type: proxmox
          url: https://192.168.10.2:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_API_USERNAME}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_API_PASSWORD}}"
          node: pve2

    - pve3:
        icon: sh-proxmox
        href: https://pve3.ihome.dev.br
        description: Nó 3 · 192.168.10.4
        widget:
          type: proxmox
          url: https://192.168.10.2:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_API_USERNAME}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_API_PASSWORD}}"
          node: pve3

    - Komodo:
        icon: sh-komodo
        href: https://komodo.ihome.dev.br
        description: Deploy dos stacks · update 04:00
        server: docker-srv-monitor
        container: komodo-core
        widget:
          type: komodo
          url: http://192.168.10.50:9120
          key: "{{HOMEPAGE_VAR_KOMODO_KEY}}"
          secret: "{{HOMEPAGE_VAR_KOMODO_SECRET}}"
          showSummary: true
          showStacks: true

# ============================================================
# GATEWAY & REDE
# ============================================================
- Gateway & Rede:

    - Omada:
        icon: sh-omada
        href: https://omada.ihome.dev.br
        description: Controlador TP-Link · 192.168.10.5
        server: docker-srv-omada
        container: omada-controller
        # Widget desligado: o login local falhou e a conta ficou bloqueada (-30119). Reative quando
        # HOMEPAGE_VAR_OMADA_USERNAME/PASSWORD forem de um usuário LOCAL do controlador (não a conta TP-Link ID).
        # widget:
        #   type: omada
        #   url: https://192.168.10.5:8043
        #   username: "{{HOMEPAGE_VAR_OMADA_USERNAME}}"
        #   password: "{{HOMEPAGE_VAR_OMADA_PASSWORD}}"
        #   site: iHome Server

    - AdGuard Home:
        icon: sh-adguard-home
        href: https://adguard.ihome.dev.br
        description: DNS primário · 192.168.10.10
        server: docker-srv-gateway
        container: adguard
        widget:
          type: adguard
          url: http://192.168.10.10:3000
          username: "{{HOMEPAGE_VAR_ADGUARD_HOME_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_HOME_PASSWORD}}"

    - AdGuard Secundário:
        icon: sh-adguard-home
        href: https://adguard2.ihome.dev.br
        description: DNS de backup · 192.168.10.50
        server: docker-srv-monitor
        container: adguard-secondary
        widget:
          type: adguard
          url: http://192.168.10.50:3001
          username: "{{HOMEPAGE_VAR_ADGUARD_SECUNDARIO_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_SECUNDARIO_PASSWORD}}"

    - NetAlertX:
        icon: sh-netalertx
        href: https://netalert.ihome.dev.br
        description: Dispositivos da rede
        server: docker-srv-gateway
        container: netalertx
        widget:
          type: netalertx
          url: http://192.168.10.10:20212
          key: "{{HOMEPAGE_VAR_NETALERTX_KEY}}"
          version: 2

    - WireGuard:
        icon: sh-wireguard
        href: https://wg.ihome.dev.br
        description: VPN (wg-easy)
        server: docker-srv-gateway
        container: wg-easy
        widget:
          type: wgeasy
          url: http://192.168.10.10:51821
          password: "{{HOMEPAGE_VAR_WIREGUARD_PASSWORD}}"  # wg-easy v14 (wg0.json): version 1, só senha
          threshold: 2

    - NGINX Proxy Manager:
        icon: sh-nginx-proxy-manager
        href: https://npm.ihome.dev.br
        description: Proxy reverso & SSL
        server: docker-srv-gateway
        container: npm
        widget:
          type: npm
          url: http://192.168.10.10:81
          username: "{{HOMEPAGE_VAR_NGINX_PROXY_MANAGER_USERNAME}}"
          password: "{{HOMEPAGE_VAR_NGINX_PROXY_MANAGER_PASSWORD}}"

    - Cloudflared:
        icon: sh-cloudflare
        href: https://dash.cloudflare.com/{{HOMEPAGE_VAR_CLOUDFLARED_ACCOUNT_ID}}/one/networks/connectors
        description: Túnel externo
        server: docker-srv-gateway
        container: cloudflared
        widget:
          type: cloudflared
          accountid: "{{HOMEPAGE_VAR_CLOUDFLARED_ACCOUNT_ID}}"
          tunnelid: "{{HOMEPAGE_VAR_CLOUDFLARED_TUNNEL_ID}}"
          key: "{{HOMEPAGE_VAR_CLOUDFLARED_KEY}}"
          fields: ["status", "origin_ip"]

