# ============================================================
# FILMES, SÉRIES & TV
# ============================================================
- Filmes, Séries & TV:

    - Jellyfin:
        icon: sh-jellyfin
        href: https://jf.ihome.dev.br
        description: Filmes e séries (iGPU UHD 770)
        server: docker-srv-media
        container: jellyfin
        # O widget nativo "jellyfin" do Homepage 1.13 chama /emby/..., que o Jellyfin 12 removeu;
        # por isso customapi direto em /Items/Counts.
        widget:
          type: customapi
          url: http://192.168.10.20:8096/Items/Counts
          refreshInterval: 300000
          headers:
            Authorization: 'MediaBrowser Token="{{HOMEPAGE_VAR_JELLYFIN_KEY}}"'
          mappings:
            - field: MovieCount
              label: Filmes
              format: number
            - field: SeriesCount
              label: Séries
              format: number
            - field: EpisodeCount
              label: Episódios
              format: number

    - Dispatcharr:
        icon: sh-dispatcharr
        href: https://dispatcharr.ihome.dev.br
        description: IPTV
        server: docker-srv-media
        container: dispatcharr_web
        widget:
          type: dispatcharr
          url: http://192.168.10.20:9191
          username: "{{HOMEPAGE_VAR_DISPATCHARR_USERNAME}}"
          password: "{{HOMEPAGE_VAR_DISPATCHARR_PASSWORD}}"
          enableActiveStreams: true

    - Seerr:
        icon: sh-seerr
        href: https://seerr.ihome.dev.br
        description: Pedidos de filmes e séries
        server: docker-srv-media
        container: seerr
        widget:
          type: seerr
          url: http://192.168.10.20:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"

