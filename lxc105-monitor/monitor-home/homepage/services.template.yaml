# MÍDIA — PLAYERS — lxc102
# ============================================================
- Mídia — Players:
    - Jellyfin:
        icon: sh-jellyfin
        href: https://jf.ihome.dev.br
        description: Filmes e séries (iGPU UHD 770)
        server: docker-srv-media
        container: jellyfin
        # O widget nativo "jellyfin" do Homepage 1.13 chama /emby/..., que o Jellyfin 12 removeu;
        # por isso customapi direto em /Items/Counts.
        widget:
          type: customapi
          url: http://192.168.10.20:8096/Items/Counts
          refreshInterval: 300000
          headers:
            Authorization: __AUTHORIZATION_21__
          mappings:
            - field: MovieCount
              label: Filmes
              format: number
            - field: SeriesCount
              label: Séries
              format: number
            - field: EpisodeCount
              label: Episódios
              format: number

