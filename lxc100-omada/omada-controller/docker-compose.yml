services:
  # ---------------------------------------------------------------------------
  # OMADA CONTROLLER — gerencia os APs/switches TP-Link Omada
  # network_mode host: a descoberta/adoção dos dispositivos usa broadcast L2
  # (UDP 27001/29810) e várias portas (8043, 8088, 29811-29817)
  # ---------------------------------------------------------------------------
  omada-controller:
    image: mbentley/omada-controller:6.1
    container_name: omada-controller
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    environment:
      - TZ=${TZ}
      - MANAGE_HTTP_PORT=8088
      - MANAGE_HTTPS_PORT=8043
      - PORTAL_HTTP_PORT=8088
      - PORTAL_HTTPS_PORT=8843
      - SHOW_SERVER_LOGS=true
      - SHOW_MONGODB_LOGS=false
    volumes:
      - ${CONFIG_PATH}/omada/data:/opt/tplink/EAPController/data
      - ${CONFIG_PATH}/omada/logs:/opt/tplink/EAPController/logs
