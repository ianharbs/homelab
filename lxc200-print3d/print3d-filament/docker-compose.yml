networks:
  print3d_net:
    external: true

services:
  # Estoque de filamento (carretéis, peso restante, custo/grama). API usada pelo bridge/OrcaSlicer.
  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    container_name: spoolman
    restart: unless-stopped
    ports:
      - "7912:8000"
    volumes:
      - ${CONFIG_PATH}/spoolman:/home/app/.local/share/spoolman   # dono uid 1000
    environment:
      - TZ=${TZ}
    networks:
      - print3d_net
