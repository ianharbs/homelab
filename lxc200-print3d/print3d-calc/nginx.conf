server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /spoolman/ {
        resolver 127.0.0.11 valid=30s;
        set $up http://spoolman:8000;
        rewrite ^/spoolman/(.*)$ /$1 break;
        proxy_pass $up;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
}
