# Stacks gerenciados pelo Komodo (Resource Sync aponta para a pasta komodo/).
# Gerado a partir das pastas lxc*/<stack>/docker-compose.yml. project_name = nome da pasta (igual ao deploy.sh).
# auto_pull = false: deploy por mudança no git não puxa imagem nova; imagens só mudam no Global Auto Update (04:00).
# Segredos: [[CHAVE]] vem do [secrets] do core.config.toml no srv-monitor.

[[stack]]
name = "omada-controller"
description = "Controladora TP-Link Omada (APs e switches)"
tags = ["rede", "srv-omada", "critico"]
[stack.config]
links = ["https://192.168.10.5:8043"]
server = "srv-omada"
repo = "ianharbs/homelab"
git_account = "ianharbs"
branch = "main"
run_directory = "lxc100-omada/omada-controller"
file_paths = ["docker-compose.yml"]
auto_pull = false
project_name = "omada-controller"
poll_for_updates = true
auto_update = false
environment = """
CONFIG_PATH=[[CONFIG_PATH]]
TZ=[[TZ]]
"""

