networks:
  media_net:
    external: true

services:
  seerr:
      image: ghcr.io/seerr-team/seerr:latest
      init: true
      container_name: seerr
      restart: unless-stopped
      environment:
        - TZ=${TZ}
        - LOG_LEVEL=info
        - DB_TYPE=postgres
        - DB_HOST=${POSTGRES_HOST}
        - DB_PORT=${POSTGRES_PORT}
        - DB_USER=${POSTGRES_USER}
        - DB_PASS=${POSTGRES_PASSWORD}
        - DB_NAME=seerr
      ports:
        - 5055:5055
      volumes:
        - ${CONFIG_PATH}/seerr:/app/config
      healthcheck:
        test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
        start_period: 20s
        timeout: 3s
        interval: 15s
        retries: 3
      networks:
        - media_net

  # Profilarr v2 (reescrita, sem migração da v1; dados da v1 em ${CONFIG_PATH}/profilarr-v1).
  # Tag "2" = última estável da v2, sem pular para uma major nova sozinha.
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2
    container_name: profilarr
    volumes:
      - ${CONFIG_PATH}/profilarr:/config
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=022
      - ORIGIN=https://profilarr.ihome.dev.br
      - PARSER_HOST=profilarr-parser
      - PARSER_PORT=5000
    ports:
      - 6868:6868
    networks:
      - media_net
    depends_on:
      profilarr-parser:
        condition: service_healthy
    restart: unless-stopped

  # Parser C# do Profilarr, só para testar custom formats / perfis na UI.
  profilarr-parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:2
    container_name: profilarr-parser
    expose:
      - "5000"
    networks:
      - media_net
    restart: unless-stopped
    
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - POSTGRES_ENABLED=${POSTGRES_ENABLED:-true}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DATABASE=bazarr_main
      - POSTGRES_USERNAME=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_PATH}/bazarr:/config
      - ${DATA_PATH}/data:/data
    ports:
      - 6767:6767
    networks:
      - media_net
      
  lingarr:
    image: ghcr.io/lingarr-translate/lingarr:latest
    container_name: lingarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - ASPNETCORE_URLS=http://+:9876
      - DB_CONNECTION=sqlite
    volumes:
      - ${CONFIG_PATH}/lingarr:/app/config
      - ${DATA_PATH}/data:/data
    ports:
      - "9876:9876"
    networks:
      - media_net
  # Avisa no Telegram quando filme/episódio fica DISPONÍVEL (importado + legenda PT ou áudio PT),
  # agrupando os episódios da mesma série. Sonarr/Radarr chamam por Webhook (On File Import);
  # a legenda é conferida no Bazarr. Segredos (tokens/chaves) em ${CONFIG_PATH}/midia-notify/secrets.env,
  # lido pelo próprio script (fora do git).
  midia-notify:
    image: python:3.12-alpine
    container_name: midia-notify
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - PYTHONUNBUFFERED=1
      - DB_PATH=/state/notify.db
    volumes:
      - ./midia-notify:/app:ro
      - ${CONFIG_PATH}/midia-notify:/state
    command: python /app/notify.py
    ports:
      # publicada desde 25/11/2026 só para o app de cadastro do CT 109 (/cadastro, token próprio; o firewall
      # do CT 109 libera só 192.168.10.20:8095). Os demais endpoints exigem WEBHOOK_TOKEN.
      - "8095:8095"
    networks:
      - media_net
    restart: unless-stopped

  # WhatsApp (GOWA, conta do chip do bot pareada como "aparelho conectado"). O midia-notify posta os
  # avisos de mídia nos grupos da Comunidade iHome por aqui e recebe as perguntas pelo webhook.
  # Eventos vão para o midia-notify e para os agentes da impressão 3D (CT 200, :8099, desde 25/11/2026).
  # Segredos (APP_BASIC_AUTH, WHATSAPP_WEBHOOK_SECRET) em ${CONFIG_PATH}/whatsapp/secrets.env, carregado
  # pelo sh antes de subir (o app não lê .env sozinho; o env_file do compose não chega pelo Komodo).
  # Parear: http://192.168.10.20:3010 (login básico) › Login › ler o QR no WhatsApp do chip.
  whatsapp:
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.10.0
    container_name: whatsapp
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -a && . /secrets.env && set +a &&
        exec /app/whatsapp rest --os=iHome --webhook=http://midia-notify:8095/whatsapp,http://192.168.10.200:8099/whatsapp
        --webhook-events=message,message.reaction --mcp-enabled=false --auto-download-media=false --auto-reject-call=true
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/whatsapp/secrets.env:/secrets.env:ro
      - ${CONFIG_PATH}/whatsapp/storages:/app/storages
      - ${CONFIG_PATH}/whatsapp/statics:/app/statics
    ports:
      - "3010:3000"
    mem_limit: 512m
    networks:
      - media_net
    restart: unless-stopped

  # Reconhecimento de voz (faster-whisper "small", int8, CPU) para o assistente do controle do
  # iHome Player (ihome-player/controle-tv/assistente.py). API estilo OpenAI em :8010
  # (/v1/audio/transcriptions). Limitado a 4 CPUs com prioridade baixa para não atrapalhar o Jellyfin;
  # só trabalha ~1 s por comando de voz. Modelos em ${CONFIG_PATH}/whisper (dono 1000:1000).
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: whisper
    environment:
      - TZ=${TZ}
      - WHISPER__COMPUTE_TYPE=int8
      - WHISPER__CPU_THREADS=4
      - WHISPER__TTL=-1  # nunca descarrega o modelo (padrão: 300 s parado)
    volumes:
      - ${CONFIG_PATH}/whisper:/home/ubuntu/.cache/huggingface/hub
    ports:
      - "8010:8000"
    cpus: 4
    cpu_shares: 256
    mem_limit: 2g
    networks:
      - media_net
    restart: unless-stopped
