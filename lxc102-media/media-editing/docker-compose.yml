networks:
  media_net:
    external: true

services:
  seerr:
      image: ghcr.io/seerr-team/seerr:latest
      init: true
      container_name: seerr
      restart: unless-stopped
      environment:
        - TZ=${TZ}
        - LOG_LEVEL=info
        - DB_TYPE=postgres
        - DB_HOST=${POSTGRES_HOST}
        - DB_PORT=${POSTGRES_PORT}
        - DB_USER=${POSTGRES_USER}
        - DB_PASS=${POSTGRES_PASSWORD}
        - DB_NAME=seerr
      ports:
        - 5055:5055
      volumes:
        - ${CONFIG_PATH}/seerr:/app/config
      healthcheck:
        test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
        start_period: 20s
        timeout: 3s
        interval: 15s
        retries: 3
      networks:
        - media_net

  # Profilarr v2 (reescrita, sem migração da v1; dados da v1 em ${CONFIG_PATH}/profilarr-v1).
  # Tag "2" = última estável da v2, sem pular para uma major nova sozinha.
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2
    container_name: profilarr
    volumes:
      - ${CONFIG_PATH}/profilarr:/config
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=022
      - ORIGIN=https://profilarr.ihome.dev.br
      - PARSER_HOST=profilarr-parser
      - PARSER_PORT=5000
    ports:
      - 6868:6868
    networks:
      - media_net
    depends_on:
      profilarr-parser:
        condition: service_healthy
    restart: unless-stopped

  # Parser C# do Profilarr, só para testar custom formats / perfis na UI.
  profilarr-parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:2
    container_name: profilarr-parser
    expose:
      - "5000"
    networks:
      - media_net
    restart: unless-stopped
    
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - POSTGRES_ENABLED=${POSTGRES_ENABLED:-true}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DATABASE=bazarr_main
      - POSTGRES_USERNAME=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_PATH}/bazarr:/config
      - ${DATA_PATH}/data:/data
    ports:
      - 6767:6767
    networks:
      - media_net
      
  lingarr:
    image: ghcr.io/lingarr-translate/lingarr:latest
    container_name: lingarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - ASPNETCORE_URLS=http://+:9876
      - DB_CONNECTION=sqlite
    volumes:
      - ${CONFIG_PATH}/lingarr:/app/config
      - ${DATA_PATH}/data:/data
    ports:
      - "9876:9876"
    networks:
      - media_net