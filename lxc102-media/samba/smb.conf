# Samba nativo do CT 102 (srv-media) — instalado via apt, NÃO é stack do Komodo.
# Cópia viva: /etc/samba/smb.conf no CT 102. Mesmas pastas do SFTPGo, num share só (\\192.168.10.20\ihome).
# Usuário: ianharbs (senha via `smbpasswd ianharbs` no CT 102).
[global]
   workgroup = WORKGROUP
   server string = srv-media
   server role = standalone server
   server min protocol = SMB2_10
   # só rede local (VLANs 192.168.x) e VPN (10.x); nunca expor na internet
   hosts allow = 127. 192.168. 10.
   hosts deny = 0.0.0.0/0
   map to guest = never
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   # desempenho p/ arquivos grandes (vídeo)
   use sendfile = yes
   aio read size = 1
   aio write size = 1
   # tudo gravado como ianharbs (1000:1000), igual Jellyfin/*arr
   force user = ianharbs
   force group = ianharbs
   create mask = 0664
   directory mask = 0775
   valid users = ianharbs
   read only = no
   browseable = yes
   # não sujar a biblioteca com lixo do Windows/macOS
   veto files = /Thumbs.db/desktop.ini/.DS_Store/._*/
   delete veto files = yes

[ihome]
   comment = Tudo: media (HD 26 TB), downloads, transcode, configs (lxc101-107, vm106)
   # /srv/ihome = binds do CT (mp3-6); configs = sshfs no host pve (/mnt/pve/configs)
   path = /srv/ihome
