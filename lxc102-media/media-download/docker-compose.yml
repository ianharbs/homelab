# qBittorrent, Prowlarr e FlareSolverr saem pela NordVPN (gluetun, WireGuard/NordLynx) com kill-switch:
# eles usam a rede do gluetun (network_mode: service:gluetun), então as portas ficam publicadas no gluetun
# e os aliases qbittorrent/prowlarr/flaresolverr continuam valendo na media_net.
# - Chave em ${CONFIG_PATH}/gluetun/gluetun.env (só no servidor, chmod 600): WIREGUARD_PRIVATE_KEY
#   (sai do access token da Nord: GET https://api.nordvpn.com/v1/users/services/credentials -> nordlynx_private_key).
# - A NordVPN não tem port forwarding: o torrent não recebe conexões de entrada.
networks:
  media_net:
    external: true

services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ${CONFIG_PATH}/gluetun/gluetun.env
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - SERVER_COUNTRIES=Brazil
      # LAN (Postgres do srv-apps, SABnzbd) e media_net (Sonarr, Radarr...) fora do túnel
      - FIREWALL_OUTBOUND_SUBNETS=192.168.10.0/24,172.20.0.0/24
      - FIREWALL_INPUT_PORTS=8080,9696,8191
      - UPDATER_PERIOD=24h
      # API do gluetun (widget do Homepage); papéis/API key em ${CONFIG_PATH}/gluetun/auth/config.toml
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
    volumes:
      - ${CONFIG_PATH}/gluetun:/gluetun
    # O 1º handshake às vezes falha e o gluetun reinicia a VPN: 60 s de folga antes de virar unhealthy,
    # senão o compose desiste de subir qbittorrent/prowlarr/flaresolverr.
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 5s
      retries: 3
    ports:
      - 8080:8080   # qbittorrent
      - 9696:9696   # prowlarr
      - 8191:8191   # flaresolverr
      - 8008:8000   # API do gluetun
    networks:
      media_net:
        aliases:
          - qbittorrent
          - prowlarr
          - flaresolverr

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    ports:
      - "11011:11011"
    volumes:
      - ${CONFIG_PATH}/cleanuparr:/config
      - ${DOWNLOAD_PATH}:/downloads
    environment:
      - PORT=11011
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=022
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11011/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - media_net

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.4
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PROWLARR__POSTGRES__HOST=${POSTGRES_HOST}
      - PROWLARR__POSTGRES__PORT=${POSTGRES_PORT}
      - PROWLARR__POSTGRES__USER=${POSTGRES_USER}
      - PROWLARR__POSTGRES__PASSWORD=${POSTGRES_PASSWORD}
      - PROWLARR__POSTGRES__MAINDB=prowlarr_main
      - PROWLARR__POSTGRES__LOGDB=prowlarr_log
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_PATH}/prowlarr:/config
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    labels:
      - deunhealth.restart.on.unhealthy=true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=54321
    volumes:
      - ${CONFIG_PATH}/qbittorrent:/config
      - ${DATA_PATH}/data:/data
      - ${DOWNLOAD_PATH}:/downloads
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/sabnzbd:/config
      - ${DATA_PATH}/data:/data
      - ${DATA_PATH}/data/downloads:/downloads
    ports:
      - 8085:8080
    restart: unless-stopped

  torrent-indexer:
    image: felipemarinho97/torrent-indexer:latest
    container_name: torrent-indexer
    restart: unless-stopped
    ports:
      - 7006:7006
    networks:
      - media_net
    environment:
      - LOG_LEVEL=0 # 0=debug, 1=info, 2=warn, 3=error
      - REDIS_HOST=redis
      - FLARESOLVERR_ADDRESS=http://flaresolverr:8191

  redis:
    image: redis:alpine
    container_name: torrent-indexer_redis
    restart: unless-stopped
    networks:
      - media_net