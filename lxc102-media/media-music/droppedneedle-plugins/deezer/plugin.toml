[plugin]
name = "deezer"
version = "1.0.0"
api_version = 1
entrypoint = "plugin:Deezer"
capabilities = ["indexer", "download_client"]
display_name = "Deezer (direto)"
description = "Busca e baixa direto do Deezer (FLAC/MP3) usando o ARL, montando a edição exata do MusicBrainz por ISRC/UPC."
author = "homelab"

[[capability]]
id = "indexer"
target_source = "plugin:deezer"
display_name = "Deezer"

[[capability]]
id = "download_client"
display_name = "Deezer"

[[settings]]
key = "arl"
label = "ARL do Deezer"
help = "Cookie 'arl' de uma conta Premium/HiFi logada em deezer.com (192 caracteres)."
secret = true

[[settings]]
key = "quality"
label = "Qualidade"
help = "flac (padrão) ou mp3_320"

[[settings]]
key = "allow_fallback"
label = "Aceitar MP3 320 quando não houver FLAC"
help = "sim/não (padrão não). Com 'não', faixa sem FLAC conta como ausente."

[[settings]]
key = "download_dir"
label = "Pasta temporária de download"
help = "Caminho dentro do container do DroppedNeedle. Padrão: /data/downloads/deezer"

[[settings]]
key = "max_parallel"
label = "Downloads simultâneos"
help = "Faixas baixadas ao mesmo tempo (padrão 3, máx. 6). Mantenha baixo para não arriscar o ARL."

[[settings]]
key = "musicbrainz_url"
label = "API do MusicBrainz"
help = "Usada para descobrir a edição-alvo. Padrão: https://musicbrainz.org/ws/2 (1 req/s)."
