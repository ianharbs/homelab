[plugin]
name = "deezer"
version = "1.0.0"
api_version = 1
entrypoint = "plugin:Deezer"
capabilities = ["indexer", "download_client"]
display_name = "Deezer (direct)"
description = "Searches and downloads directly from Deezer (FLAC/MP3) with your ARL, assembling the exact MusicBrainz edition by ISRC/UPC. / Busca e baixa direto do Deezer (FLAC/MP3) com o seu ARL, montando a edição exata do MusicBrainz por ISRC/UPC."
author = "DroppedNeedle community plugin"

[[capability]]
id = "indexer"
target_source = "plugin:deezer"
display_name = "Deezer"

[[capability]]
id = "download_client"
display_name = "Deezer"

[[settings]]
key = "arl"
label = "Deezer ARL"
help = "The 'arl' cookie of a Premium/HiFi account logged in at deezer.com (192 characters). / Cookie 'arl' de uma conta Premium/HiFi logada em deezer.com."
secret = true

[[settings]]
key = "quality"
label = "Quality / Qualidade"
help = "flac (default) or mp3_320"

[[settings]]
key = "allow_fallback"
label = "Accept MP3 320 when FLAC is missing / Aceitar MP3 320 sem FLAC"
help = "yes/no (default no). With 'no', a track without FLAC counts as missing. / sim/não (padrão não)."

[[settings]]
key = "download_dir"
label = "Staging folder / Pasta temporária"
help = "Path inside the DroppedNeedle container. Default: /data/downloads/deezer"

[[settings]]
key = "max_parallel"
label = "Parallel downloads / Downloads simultâneos"
help = "Tracks downloaded at once (default 3, max 6). Keep it low to protect the ARL."

[[settings]]
key = "musicbrainz_url"
label = "MusicBrainz API"
help = "Used to find the target edition. Default: https://musicbrainz.org/ws/2 (1 req/s). Use the same source as DroppedNeedle if you run a mirror."
