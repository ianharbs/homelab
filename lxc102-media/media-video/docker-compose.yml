networks:
  media_net:
    external: true

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1
    group_add:
      - "993"
      - "44"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - LIBVA_DRIVER_NAME=iHD
      - LIBVA_DRIVERS_PATH=/usr/lib/jellyfin-ffmpeg/lib/dri
      - INTEL_MEDIA_RUNTIME=/usr/lib/jellyfin-ffmpeg/lib
    volumes:
      - ${CONFIG_PATH}/jellyfin:/config
      - ${DATA_PATH}/data:/data
      - ${CONFIG_PATH}/jellyfin/custom-cont-init.d:/custom-cont-init.d:ro
      - /transcode:/transcode
      - /etc/OpenCL/vendors:/etc/OpenCL/vendors:ro
      - /usr/lib/x86_64-linux-gnu/libOpenCL.so.1:/usr/lib/x86_64-linux-gnu/libOpenCL.so.1:ro
      - /usr/lib/x86_64-linux-gnu/libigc.so.1:/usr/lib/x86_64-linux-gnu/libigc.so.1:ro
      - /usr/lib/x86_64-linux-gnu/libigdfcl.so.1:/usr/lib/x86_64-linux-gnu/libigdfcl.so.1:ro
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    networks:
      - media_net

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - RADARR__POSTGRES__HOST=${POSTGRES_HOST}
      - RADARR__POSTGRES__PORT=${POSTGRES_PORT}
      - RADARR__POSTGRES__USER=${POSTGRES_USER}
      - RADARR__POSTGRES__PASSWORD=${POSTGRES_PASSWORD}
      - RADARR__POSTGRES__MAINDB=radarr_main
      - RADARR__POSTGRES__LOGDB=radarr_log
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_PATH}/radarr:/config
      - ${DATA_PATH}/data:/data
    ports:
      - 7878:7878
    networks:
      - media_net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SONARR__POSTGRES__HOST=${POSTGRES_HOST}
      - SONARR__POSTGRES__PORT=${POSTGRES_PORT}
      - SONARR__POSTGRES__USER=${POSTGRES_USER}
      - SONARR__POSTGRES__PASSWORD=${POSTGRES_PASSWORD}
      - SONARR__POSTGRES__MAINDB=sonarr_main
      - SONARR__POSTGRES__LOGDB=sonarr_log
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_PATH}/sonarr:/config
      - ${DATA_PATH}/data:/data
    ports:
      - 8989:8989
    networks:
      - media_net
