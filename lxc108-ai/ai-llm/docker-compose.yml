services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "0.0.0.0:11434:11434"
    environment:
      - TZ=${TZ}
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_HOST=0.0.0.0  # Adicione esta linha
    volumes:
      - ${CONFIG_PATH}/ollama:/root/.ollama
    networks:
      - ai_net

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - TZ=${TZ}
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET}
      - WEBUI_URL=https://ai.ihome.dev.br
      # Login pelo Authentik (OIDC); client id/secret em ${CONFIG_PATH}/open-webui/oauth.env.
      # Contas existentes são ligadas pelo e-mail; papel vem dos grupos (authentik Admins = admin).
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - OAUTH_PROVIDER_NAME=Authentik
      - OPENID_PROVIDER_URL=https://auth.ihome.dev.br/application/o/open-webui/.well-known/openid-configuration
      - OAUTH_SCOPES=openid email profile
      - ENABLE_OAUTH_ROLE_MANAGEMENT=true
      - OAUTH_ROLES_CLAIM=groups
      - OAUTH_ALLOWED_ROLES=Homelab,authentik Admins
      - OAUTH_ADMIN_ROLES=authentik Admins
    env_file:
      - ${CONFIG_PATH}/open-webui/oauth.env
    extra_hosts:
      - auth.ihome.dev.br:192.168.10.10
    volumes:
      - ${CONFIG_PATH}/open-webui:/app/backend/data
    depends_on:
      - ollama
    networks:
      - ai_net

networks:
  ai_net:
    external: true