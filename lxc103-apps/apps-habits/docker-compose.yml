networks:
  apps_net:
    external: true

services:
  wger-web:
    image: docker.io/wger/server:latest
    container_name: wger-web
    restart: unless-stopped
    environment:
      - DJANGO_DB_ENGINE=django.db.backends.postgresql
      - DJANGO_DB_DATABASE=wger
      - DJANGO_DB_USER=${POSTGRES_USER}
      - DJANGO_DB_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_DB_HOST=${POSTGRES_HOST}
      - DJANGO_DB_PORT=${POSTGRES_PORT}
      - DJANGO_CACHE_BACKEND=django_redis.cache.RedisCache
      - DJANGO_CACHE_LOCATION=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/3
      - DJANGO_CACHE_CLIENT_CLASS=django_redis.client.DefaultClient
      - DJANGO_CACHE_TIMEOUT=1296000
      - CSRF_TRUSTED_ORIGINS=https://wger.ihome.dev.br
      - X_FORWARDED_PROTO_HEADER_SET=True
      - CELERY_BROKER=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/4
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/4
      - WGER_USE_GUNICORN=True
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - SIGNING_KEY=${DJANGO_SECRET_KEY}
      - SITE_URL=https://wger.ihome.dev.br
      - DJANGO_DEBUG=False
      - WGER_INSTANCE=https://wger.de
      - SYNC_EXERCISES_ON_STARTUP=True
      - DOWNLOAD_EXERCISE_IMAGES_ON_STARTUP=False
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/wger/static:/home/wger/static
      - ${CONFIG_PATH}/wger/media:/home/wger/media
    expose:
      - 8000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    networks:
      - apps_net

  wger-celery-worker:
    image: docker.io/wger/server:latest
    container_name: wger-celery-worker
    restart: unless-stopped
    command: /start-worker
    depends_on:
      wger-web:
        condition: service_healthy
    environment:
      - DJANGO_DB_ENGINE=django.db.backends.postgresql
      - DJANGO_DB_DATABASE=wger
      - DJANGO_DB_USER=${POSTGRES_USER}
      - DJANGO_DB_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_DB_HOST=${POSTGRES_HOST}
      - DJANGO_DB_PORT=${POSTGRES_PORT}
      - DJANGO_CACHE_BACKEND=django_redis.cache.RedisCache
      - DJANGO_CACHE_LOCATION=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/3
      - DJANGO_CACHE_CLIENT_CLASS=django_redis.client.DefaultClient
      - DJANGO_CACHE_TIMEOUT=1296000
      - CELERY_BROKER=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/4
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/4
      - WGER_USE_GUNICORN=True
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - SIGNING_KEY=${DJANGO_SECRET_KEY}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/wger/media:/home/wger/media
    networks:
      - apps_net

  wger-celery-beat:
    image: docker.io/wger/server:latest
    container_name: wger-celery-beat
    restart: unless-stopped
    command: /start-beat
    depends_on:
      wger-web:
        condition: service_healthy
    environment:
      - DJANGO_DB_ENGINE=django.db.backends.postgresql
      - DJANGO_DB_DATABASE=wger
      - DJANGO_DB_USER=${POSTGRES_USER}
      - DJANGO_DB_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_DB_HOST=${POSTGRES_HOST}
      - DJANGO_DB_PORT=${POSTGRES_PORT}
      - DJANGO_CACHE_BACKEND=django_redis.cache.RedisCache
      - DJANGO_CACHE_LOCATION=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/3
      - DJANGO_CACHE_CLIENT_CLASS=django_redis.client.DefaultClient
      - DJANGO_CACHE_TIMEOUT=1296000
      - CELERY_BROKER=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/4
      - CELERY_BACKEND=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/4
      - WGER_USE_GUNICORN=True
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - SIGNING_KEY=${DJANGO_SECRET_KEY}
      - TZ=${TZ}
    networks:
      - apps_net

  wger-nginx:
    image: docker.io/nginx:stable
    container_name: wger-nginx
    restart: unless-stopped
    depends_on:
      wger-web:
        condition: service_healthy
    volumes:
      - ${CONFIG_PATH}/wger/static:/wger/static:ro
      - ${CONFIG_PATH}/wger/media:/wger/media:ro
      - ${CONFIG_PATH}/wger/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9110:80"
    networks:
      - apps_net