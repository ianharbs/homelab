networks:
  db_net:
    external: true

services:
  postgres:
    # Major fixada: subir de major exige pg_upgrade/dump. Correções 18.x aparecem como "update disponível" no Komodo.
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    command: ["postgres", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ${CONFIG_PATH}/postgres:/var/lib/postgresql
    networks:
      - db_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - ${CONFIG_PATH}/pgadmin:/var/lib/pgadmin
    networks:
      - db_net
    depends_on:
      - postgres
