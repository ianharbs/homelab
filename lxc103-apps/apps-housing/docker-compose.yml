networks:
  apps_net:
    external: true

services:
  bar-assistant:
    image: barassistant/server:v5
    container_name: bar-assistant
    environment:
      - APP_URL=http://${BAR_ASSISTANT_HOST}:9092
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY}
      - MEILISEARCH_HOST=http://${MEILI_HOST}:${MEILI_PORT}
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ALLOW_REGISTRATION=true
    restart: unless-stopped
    ports:
      - "9092:8080"
    volumes:
      - ${CONFIG_PATH}/barassistant:/var/www/html/storage
    networks:
      - apps_net

  salt-rim:
    image: barassistant/salt-rim:v4
    container_name: salt-rim
    depends_on:
      - bar-assistant
    environment:
      - API_URL=http://${BAR_ASSISTANT_HOST}:9092
      - MEILISEARCH_URL=http://${MEILI_HOST}:${MEILI_PORT}
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - apps_net

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.9.2
    container_name: mealie
    restart: unless-stopped
    ports:
      - 9925:9000
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - ${CONFIG_PATH}/mealie-data:/app/data/
    environment:
      - ALLOW_SIGNUP=false
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - BASE_URL=https://mealie.ihome.dev.br
      - DB_ENGINE=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SERVER=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=mealie
      # Login pelo Authentik (OIDC); client id/secret em ${CONFIG_PATH}/mealie-data/oauth.env. Contas ligadas pelo e-mail.
      - OIDC_AUTH_ENABLED=true
      - OIDC_SIGNUP_ENABLED=true
      - OIDC_CONFIGURATION_URL=https://auth.ihome.dev.br/application/o/mealie/.well-known/openid-configuration
      - OIDC_PROVIDER_NAME=Authentik
      - OIDC_AUTO_REDIRECT=false
      - OIDC_REMEMBER_ME=true
      - OIDC_USER_GROUP=Homelab
      - OIDC_ADMIN_GROUP=authentik Admins
    env_file:
      - ${CONFIG_PATH}/mealie-data/oauth.env
    extra_hosts:
      - auth.ihome.dev.br:192.168.10.10
    networks:
      - apps_net
