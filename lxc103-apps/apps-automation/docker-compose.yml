networks:
  apps_net:
    external: true

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    user: root
    ports:
      - "5678:5678"
    environment:
      - TZ=${TZ}
      - N8N_HOST=n8n.ihome.dev.br
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_TRUST_PROXY=true
      - WEBHOOK_URL=https://n8n.ihome.dev.br/
      - N8N_EDITOR_BASE_URL=https://n8n.ihome.dev.br/
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_ENCRYPTION_KEY}
      - N8N_NATIVE_PYTHON_RUNNER=true
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${POSTGRES_HOST}
      - DB_POSTGRESDB_PORT=${POSTGRES_PORT}
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - ${CONFIG_PATH}/n8n:/home/node/.n8n
    networks:
      - apps_net

  n8n-runner:
    image: n8nio/runners:latest
    container_name: n8n-runner
    restart: unless-stopped
    user: root
    environment:
      - TZ=${TZ}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_ENCRYPTION_KEY}
      - N8N_RUNNERS_STDLIB_ALLOW=*
      - N8N_RUNNERS_EXTERNAL_ALLOW=pandas,openpyxl
    volumes:
      - ${CONFIG_PATH}/n8n/data:/data
    networks:
      - apps_net