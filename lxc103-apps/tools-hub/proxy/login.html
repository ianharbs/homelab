<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iHome Tools · Login</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #7c6af7;
    --accent2: #f7916a;
    --text: #e8e8f0;
    --muted: #5a5a72;
    --error: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Verdana, Geneva, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.35;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 600px;
    background: radial-gradient(ellipse, rgba(124,106,247,0.1) 0%, transparent 70%);
    pointer-events: none;
  }
  .card {
    position: relative;
    z-index: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }
  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .logo-label {
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 700;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 6px;
    color: var(--text);
  }
  .sub {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 36px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: Verdana, Geneva, sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,247,0.1);
  }
  .error-msg {
    font-size: 11px;
    color: var(--error);
    margin-bottom: 16px;
    min-height: 16px;
    letter-spacing: 0.5px;
    display: none;
    font-weight: 700;
  }
  .error-msg.visible { display: block; }
  button {
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    font-family: Verdana, Geneva, sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover { background: #9080ff; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(124,106,247,0.4); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .spinner {
    display: none;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  button.loading .btn-text { display: none; }
  button.loading .spinner { display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <div class="logo-dot"></div>
    <span class="logo-label">iHome · Tools</span>
  </div>
  <h1>Bem-vindo</h1>
  <p class="sub">// autenticação necessária</p>

  <div class="field">
    <label>Usuário</label>
    <input type="text" id="username" autocomplete="username" spellcheck="false" autofocus>
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="password" autocomplete="current-password">
  </div>

  <div class="error-msg" id="error"></div>

  <button id="btn" onclick="doLogin()">
    <span class="btn-text">Entrar</span>
    <div class="spinner"></div>
  </button>
</div>

<script>
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });

  async function doLogin() {
    const btn = document.getElementById('btn');
    const errorEl = document.getElementById('error');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      errorEl.textContent = 'Preencha usuário e senha.';
      errorEl.classList.add('visible');
      return;
    }

    btn.disabled = true;
    btn.classList.add('loading');
    errorEl.classList.remove('visible');

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        window.location.href = '/';
      } else {
        errorEl.textContent = data.error || 'Credenciais inválidas.';
        errorEl.classList.add('visible');
        document.getElementById('password').value = '';
      }
    } catch {
      errorEl.textContent = 'Erro de conexão com o servidor.';
      errorEl.classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }
</script>
</body>
</html>
