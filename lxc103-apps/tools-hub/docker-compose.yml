networks:
  apps_net:
    external: true

services:
  tools-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: tools-proxy
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - AUTH_USER=${TOOLS_USER}
      - AUTH_PASSWORD=${TOOLS_PASSWORD}
      - MEALIE_TOKEN=${MEALIE_TOKEN}
    ports:
      - "3100:3100"
    networks:
      - apps_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  tools-nginx:
    image: nginx:alpine
    container_name: tools-nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ${CONFIG_PATH}/tools-hub/html:/usr/share/nginx/html:ro
      - ${CONFIG_PATH}/tools-hub/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - apps_net
    depends_on:
      - tools-proxy
