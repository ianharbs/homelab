# Authentik (SSO/OIDC e forward-auth do NPM), usando o Postgres compartilhado do srv-apps (banco "authentik").
# Desde a 2025.10 não precisa mais de Redis.
# - Segredos em ${CONFIG_PATH}/authentik/authentik.env (só no servidor, chmod 600):
#   AUTHENTIK_SECRET_KEY, AUTHENTIK_BOOTSTRAP_PASSWORD e AUTHENTIK_BOOTSTRAP_EMAIL (o akadmin só é criado no primeiro start).
# - Tag na minor (2026.8): o auto-update só traz patches; subir de versão é manual (stack "critico").
# - Outposts só pelo embutido (sem docker.sock).
networks:
  apps_net:
    external: true

x-authentik: &authentik
  image: ghcr.io/goauthentik/server:2026.8
  restart: unless-stopped
  shm_size: 512mb
  env_file:
    - ${CONFIG_PATH}/authentik/authentik.env
  environment:
    - TZ=${TZ}
    - AUTHENTIK_POSTGRESQL__HOST=${POSTGRES_HOST}
    - AUTHENTIK_POSTGRESQL__PORT=${POSTGRES_PORT}
    - AUTHENTIK_POSTGRESQL__USER=${POSTGRES_USER}
    - AUTHENTIK_POSTGRESQL__PASSWORD=${POSTGRES_PASSWORD}
    - AUTHENTIK_POSTGRESQL__NAME=authentik
    - AUTHENTIK_ERROR_REPORTING__ENABLED=false
    - AUTHENTIK_DISABLE_UPDATE_CHECK=true
  volumes:
    - ${CONFIG_PATH}/authentik/data:/data
    - ${CONFIG_PATH}/authentik/custom-templates:/templates
  networks:
    - apps_net

services:
  authentik-server:
    <<: *authentik
    container_name: authentik-server
    command: server
    ports:
      - 9000:9000
      - 9443:9443

  authentik-worker:
    <<: *authentik
    container_name: authentik-worker
    command: worker
    volumes:
      - ${CONFIG_PATH}/authentik/data:/data
      - ${CONFIG_PATH}/authentik/certs:/certs
      - ${CONFIG_PATH}/authentik/custom-templates:/templates
