# Bloco do Authentik (portaria) colado no Advanced de cada proxy host do NPM que deve exigir login.
# Para proteger um site novo: NPM → host → Advanced → colar este bloco (mantendo o que já existir).
# Depois liberar no Authentik nada a mais: o provider 'Portaria ihome.dev.br' cobre todo *.ihome.dev.br.
# >>> Authentik forward-auth (portaria) — não editar à mão; ver README
proxy_buffers 8 16k;
proxy_buffer_size 32k;
auth_request /outpost.goauthentik.io/auth/nginx;
error_page 401 = @goauthentik_proxy_signin;
auth_request_set $auth_cookie $upstream_http_set_cookie;
add_header Set-Cookie $auth_cookie;
location /outpost.goauthentik.io {
  auth_request off;
  proxy_pass http://192.168.10.30:9000/outpost.goauthentik.io;
  proxy_set_header Host $host;
  proxy_set_header X-Original-URL https://$http_host$request_uri;
  add_header Set-Cookie $auth_cookie;
  auth_request_set $auth_cookie $upstream_http_set_cookie;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
}
location @goauthentik_proxy_signin {
  internal;
  add_header Set-Cookie $auth_cookie;
  return 302 https://$http_host/outpost.goauthentik.io/start?rd=https://$http_host$request_uri;
}
# <<< Authentik forward-auth
