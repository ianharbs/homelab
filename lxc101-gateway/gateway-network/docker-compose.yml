networks:
  gateway_net:
    external: true

services:
  netalertx:
    image: jokobsk/netalertx:latest
    container_name: netalertx
    read_only: true
    environment:
      - TZ=${TZ}
      - PUID=20211
      - PGID=20211
      - PORT=20211
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    tmpfs:
      - "/tmp:uid=20211,gid=20211,mode=1777"
    volumes:
      - ${CONFIG_PATH}/netalertx:/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    network_mode: host

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy
    container_name: wg-easy
    environment:
      - WG_HOST=${WG_HOST}
      - PASSWORD_HASH=${WG_PASSWORD_HASH}
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEFAULT_DNS=192.168.10.10
      - WG_MTU=1420
    volumes:
      - ${CONFIG_PATH}/wg-easy:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      - gateway_net
